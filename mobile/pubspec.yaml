name: freetier_radar
description: Discover and track generous free-tier developer services
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  google_fonts: ^6.1.0
  share_plus: ^7.2.1
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.1
  flutter_animate: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#181825"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
